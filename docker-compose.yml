services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tianai}
      POSTGRES_USER: ${POSTGRES_USER:-tianai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tianai}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tianai} -d $${POSTGRES_DB:-tianai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tianai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tianai-secret}
    ports:
      - "${MINIO_BIND:-127.0.0.1}:9000:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tianai}:${POSTGRES_PASSWORD:-tianai}@postgres:5432/${POSTGRES_DB:-tianai}
      STORAGE_DIR: /app/storage
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      LOCAL_LLM_MODEL_DIR: /app/models
      LOCAL_LLM_MODEL_FILE: Qwen3-4B-Q4_K_M.gguf
      LOCAL_LLM_MODEL_URL: https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf?download=true
      LOCAL_LLM_CONTEXT_SIZE: ${LOCAL_LLM_CONTEXT_SIZE:-8192}
      LOCAL_LLM_GPU: ${LOCAL_LLM_GPU:-auto}
      LOCAL_LLM_AUTO_DOWNLOAD: "true"
      LEARNING_MIN_CONFIDENCE: 0.82
      LEARNING_AUTO_RETRAIN_THRESHOLD: 20
      LEARNING_REVIEW_WORKER: "false"
      LEARNING_LLM_REVIEW: "true"
      TRAINING_PYTHON: python
      TRAINING_BASE_MODEL: Qwen/Qwen3-4B
      COSYVOICE_URL: ${COSYVOICE_URL:-http://host.docker.internal:50000}
      AUDIO_FFMPEG_BIN: ${AUDIO_FFMPEG_BIN:-ffmpeg}
    ports:
      - "${API_BIND:-127.0.0.1}:4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - backend_data:/app/data
      - backend_storage:/app/storage
      - backend_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "${WEB_BIND:-127.0.0.1}:5173:5173"
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-replace-with-cloudflare-tunnel-token}
    restart: unless-stopped
    depends_on:
      - frontend

volumes:
  postgres_data:
  minio_data:
  backend_data:
  backend_storage:
  backend_models:
